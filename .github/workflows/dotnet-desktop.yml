name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore PersonalToolbox.csproj

    - name: Publish
      run: dotnet publish PersonalToolbox.csproj --configuration Release --runtime win-x64 --self-contained false --output publish

    - name: Pack zip
      shell: pwsh
      run: Compress-Archive -Path publish\* -DestinationPath PersonalToolbox-win-x64.zip -Force

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: PersonalToolbox-win-x64.zip
        generate_release_notes: true
