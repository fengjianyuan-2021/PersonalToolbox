# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: PersonalToolbox CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore PersonalToolbox.csproj

    - name: Build
      run: dotnet build PersonalToolbox.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish PersonalToolbox.csproj --configuration Release --runtime win-x64 --self-contained false --output publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PersonalToolbox-win-x64
        path: publish/
